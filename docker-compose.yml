services:
  postgres:
    image: postgres:18-alpine
    container_name: order_service_postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderdb}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: order_service_wiremock
    ports:
      - "${WIREMOCK_PORT:-8081}:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    command: ["--global-response-templating"]
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:8080/__admin/mappings || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_service_app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICES_DISCOUNT_BASE-URL: http://wiremock:8080/api/v1/discounts
      SERVICES_NOTIFICATION_BASE-URL: http://wiremock:8080/api/v1/notifications
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
